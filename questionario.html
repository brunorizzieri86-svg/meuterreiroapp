<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sua opinião · MEU TERREIRO</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#2b2118;--mut:#7a6a58;--pri:#8a4b12;--pri2:#b8691c;--ok:#2f7d4f;--line:#e6dccb}
@media(prefers-color-scheme:dark){:root{--bg:#1b1611;--card:#262019;--ink:#f3ebdf;--mut:#b5a58f;--pri:#e0a05a;--pri2:#c98438;--line:#3a3025}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;width:0;background:var(--pri2);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:22px;margin:0 0 8px}h2{font-size:19px;margin:0 0 14px}.mut{color:var(--mut);font-size:15px}
.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--pri);font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.opt.on{border-color:var(--pri2);background:color-mix(in srgb,var(--pri2) 14%,transparent);font-weight:600}
textarea,input{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;margin-top:16px}.btn{flex:1;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--pri2);color:#fff}
.btn.sec2{background:transparent;color:var(--ink);border:2px solid var(--line)}.btn:disabled{opacity:.4}
.ok{background:var(--ok)}pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;max-height:220px;overflow:auto}
</style></head><body><main>
<div id="app"></div>
</main>
<script>
const WA='5511953525141';
const Q=[
{s:'Conectar a casa',q:'Você encontrou sozinha o botão "Conectar minha casa"?',o:['Sim, na hora','Sim, mas demorei','Não, precisei de ajuda']},
{s:'Conectar a casa',q:'Ficou claro o que é o código de liberação?',o:['Sim, bem claro','Entendi mais ou menos','Não entendi']},
{s:'Conectar a casa',q:'Os campos (nome da casa, e-mail, senha) foram fáceis de preencher?',o:['Sim, todos','Algum me confundiu','Fiquei perdida']},
{s:'Conectar a casa',q:'Apareceu algum erro ou mensagem estranha?',o:['Não, nenhum','Sim, uma vez','Sim, várias vezes'],t:'Se apareceu, escreva o que dizia:'},
{s:'Conectar a casa',q:'Conseguiu terminar a conexão?',o:['Sim, sozinha','Sim, com ajuda','Não consegui']},
{s:'Depois de conectar',q:'Seus dados (pessoas, agenda, financeiro) continuaram no app?',o:['Sim, tudo certo','Faltou alguma coisa','Não sei conferir'],t:'Se faltou, o quê?'},
{s:'Depois de conectar',q:'A tela inicial deixou claro o que fazer agora?',o:['Sim','Mais ou menos','Não']},
{s:'Depois de conectar',q:'Foi fácil convidar um filho pelo WhatsApp?',o:['Muito fácil','Deu para fazer','Difícil','Ainda não tentei']},
{s:'Depois de conectar',q:'O filho convidado conseguiu entrar e ver a agenda?',o:['Sim, sem problema','Sim, com dificuldade','Não conseguiu','Ainda não testei']},
{s:'Dia a dia',q:'Alguma palavra ou tela que você não entendeu?',o:['Não, tudo claro','Algumas','Várias'],t:'Quais?'},
{s:'Dia a dia',q:'Sentiu falta de alguma coisa no app?',o:['Não','Sim, de uma coisa','Sim, de várias'],t:'Do quê?'},
{s:'Dia a dia',q:'O app é rápido e estável no seu celular?',o:['Sim, rápido','Às vezes trava','Lento ou quebra muito']},
{s:'Dia a dia',q:'Para você, usar o app é...',o:['Simples','Normal','Complicado']},
{s:'Plano',q:'Você entendeu o que acontece depois dos 60 dias de teste?',o:['Sim','Mais ou menos','Não']},
{s:'Plano',q:'Quanto você acha justo pagar por mês pelo Terreiro Conectado?',o:['Até R$ 30','R$ 30 a R$ 60','R$ 60 a R$ 100','Mais de R$ 100','Não sei']},
{s:'Plano',q:'Você recomendaria o app para outro terreiro?',o:['Com certeza','Talvez','Ainda não'],t:'Quer deixar algum recado?'}
];
const A=Q.map(()=>({o:null,t:''}));let i=0,nome='';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('mtq',JSON.stringify({A,i,nome}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('mtq')||'null');if(d&&d.A&&d.A.length===Q.length){d.A.forEach((a,k)=>A[k]=a);i=d.i||0;nome=d.nome||''}}catch(e){}
function bar(){return `<div class="bar"><i style="width:${Math.round(i/Q.length*100)}%"></i></div>`}
function start(){app.innerHTML=`<div class="card"><h1>Sua opinião vale muito 🙏</h1><p class="mut">São ${Q.length} perguntas rápidas, é só tocar na resposta. No final você envia pelo WhatsApp. Suas respostas ajudam a deixar o MEU TERREIRO mais fácil.</p><input id="nm" placeholder="Seu nome (e da casa)" value="${esc(nome)}"><div class="row"><button class="btn" id="go">${i>0?'Continuar':'Começar'}</button></div></div>`;
$('#go').onclick=()=>{nome=$('#nm').value.trim();save();show()}}
function show(){
 if(i>=Q.length)return fim();
 const q=Q[i],a=A[i];
 app.innerHTML=`${bar()}<div class="card"><div class="sec">${esc(q.s)} · ${i+1} de ${Q.length}</div><h2>${esc(q.q)}</h2>${q.o.map((o,k)=>`<button class="opt ${a.o===k?'on':''}" data-k="${k}">${esc(o)}</button>`).join('')}${q.t?`<textarea id="tx" rows="2" placeholder="${esc(q.t)} (opcional)">${esc(a.t)}</textarea>`:''}<div class="row"><button class="btn sec2" id="bk" ${i?'':'disabled'}>Voltar</button><button class="btn" id="nx" ${a.o===null?'disabled':''}>${i===Q.length-1?'Finalizar':'Próxima'}</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a.o=+b.dataset.k;save();show()});
 const tx=$('#tx');if(tx)tx.oninput=()=>{a.t=tx.value;save()};
 $('#bk').onclick=()=>{i--;save();show()};$('#nx').onclick=()=>{i++;save();show()};
}
function resumo(){let t='*Questionário MEU TERREIRO*\n'+(nome?'De: '+nome+'\n':'')+'\n';let s='';
 Q.forEach((q,k)=>{if(q.s!==s){s=q.s;t+='\n*'+s+'*\n'}t+=(k+1)+'. '+q.q+'\n   → '+(A[k].o===null?'(sem resposta)':q.o[A[k].o])+(A[k].t?'\n   ✎ '+A[k].t:'')+'\n'});return t}
function fim(){const t=resumo();
 app.innerHTML=`${bar().replace(/width:\d+%/,'width:100%')}<div class="card"><h1>Obrigado! 🙌</h1><p class="mut">Toque no botão verde para enviar as respostas pelo WhatsApp.</p><pre>${esc(t)}</pre><div class="row"><button class="btn ok" id="wa">Enviar pelo WhatsApp</button></div><div class="row"><button class="btn sec2" id="cp">Copiar respostas</button><button class="btn sec2" id="rv">Revisar</button></div></div>`;
 $('#wa').onclick=()=>window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(t),'_blank');
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(t);$('#cp').textContent='Copiado ✓'}catch(e){$('#cp').textContent='Copie manualmente'}};
 $('#rv').onclick=()=>{i=0;save();show()};
}
start();
</script></body></html>

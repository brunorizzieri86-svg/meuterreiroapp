<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual do usuário · MEU TERREIRO</title><style>html,body{margin:0;height:100%;background:#f6f2e8}</style></head><body><div id="app"></div><script>
const MT_MANUAL=[{"id":"inicio","icon":"🚀","title":"Primeiros passos","html":"\n<p>O <b>MEU TERREIRO</b> é um aplicativo de administração para casas de Umbanda e Candomblé. Ele organiza <b>pessoas, agenda de giras, mensalidades, finanças, estoque, patrimônio, documentos e comunicação</b> em um só lugar, com respeito à tradição da sua casa.</p>\n<h3>Novidade V0.4.9.8 — vencimentos no cadastro</h3><p>Mensalidade: escolha ou digite um dia entre 1 e 31. Em meses curtos, o vencimento é ajustado ao último dia. Avulso: escolha uma data no calendário ou digite DD/MM/AAAA. Informe motivo e forma preferida de pagamento. Qualquer tipo de pessoa pode ter cobrança. Salvar o cadastro não cria lançamento; na ficha, use Lançar pagamento e confirme o registro no Financeiro.</p><h3>Novidade V0.4.9.8 — vencimentos no cadastro</h3><p>Mensalidade: escolha ou digite um dia entre 1 e 31. Em meses curtos, o vencimento é ajustado ao último dia. Avulso: escolha uma data no calendário ou digite DD/MM/AAAA. Informe motivo e forma preferida de pagamento. Qualquer tipo de pessoa pode ter cobrança. Salvar o cadastro não cria lançamento; na ficha, use Lançar pagamento e confirme o registro no Financeiro.</p><h3>Como seus dados são guardados</h3>\n<ul>\n<li>Os dados ficam <b>salvos no próprio aparelho</b> (celular ou computador), com cópia interna de segurança. Funciona mesmo sem internet depois de aberto uma vez.</li>\n<li>O celular e o computador <b>não sincronizam entre si</b>. Se usar nos dois, cada um terá seus próprios dados. Para levar os dados de um aparelho ao outro, use <span class=\"mm-b\">Backup completo</span> e <span class=\"mm-b\">Restaurar</span> (capítulo Backup &amp; Proteção).</li>\n<li>O app <b>nunca envia mensagens sozinho</b>: ele abre o WhatsApp com o texto pronto e você confirma o envio.</li>\n</ul>\n<h3>Primeiro acesso (criar o login)</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> tela “Prepare seu acesso”, que aparece ao abrir o app pela primeira vez.</div>\n<ol class=\"mm-steps\">\n<li>Digite o <b>nome do responsável</b> (administrador).</li>\n<li>Informe o <b>WhatsApp do administrador</b>. Ele é usado como destino seguro nos testes do Modo Demonstração, para nenhuma mensagem de teste chegar a outras pessoas.</li>\n<li>Escolha um <b>login</b> e crie uma <b>senha</b> (mínimo de 6 caracteres). Digite a senha de novo em <b>Confirme a senha</b>.</li>\n<li>Marque <b>“Li e aceito os Termos de Uso e a Política de Privacidade”</b>. Você pode ler os dois antes, tocando nos links.</li>\n<li>Toque em <span class=\"mm-b\">Criar acesso no MEU TERREIRO</span>. Em telas pequenas ou janelas baixas, role a tela até o fim para ver o botão.</li>\n</ol>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> não existe recuperação automática de senha por e-mail, porque os dados ficam só no seu aparelho. Anote login e senha em local seguro e mantenha <b>backups</b> em dia.</div>\n<h3>Instalar como aplicativo</h3>\n<ul>\n<li><b>Android (Chrome):</b> menu ⋮ → <i>Instalar aplicativo</i>.</li>\n<li><b>iPhone/iPad (Safari):</b> botão Compartilhar → <i>Adicionar à Tela de Início</i>.</li>\n<li><b>Computador (Chrome/Edge):</b> ícone <i>Instalar</i> na barra de endereço.</li>\n</ul>\n<div class=\"mm-tip\"><b>💡 Dica:</b> instalado, o MEU TERREIRO abre com ícone próprio, em tela cheia, como um aplicativo comum.</div>\n<h3>Período gratuito e Plano PRO</h3>\n<p>O app oferece <b>30 dias grátis</b> por aparelho. Depois disso entra em <b>Modo Restrito</b>: seus dados continuam guardados, mas os módulos operacionais ficam bloqueados até a ativação do Plano PRO. Backup, restauração, configurações e assinatura continuam disponíveis. Detalhes no capítulo Plano &amp; Assinatura.</p>\n<h3>Roteiro recomendado para começar</h3>\n<ol class=\"mm-steps\">\n<li><b>Dados da Casa</b> (Configurações): nome, contatos, endereço, logo e texto do rodapé dos PDFs.</li>\n<li><b>Listas de apoio</b> (Configurações): valor padrão da mensalidade, categorias financeiras, centros de custo, tipos de evento e categorias de estoque.</li>\n<li><b>Pessoas</b>: cadastre mensalistas, consulentes e convidados.</li>\n<li><b>Agenda &amp; Giras</b>: cadastre as próximas giras e reuniões.</li>\n<li><b>Frequência</b>: ajuste a meta (Configurações → Frequência) e passe a fazer a chamada nas giras.</li>\n<li><b>Financeiro</b>: cadastre as contas em Caixa &amp; Bancos e comece a lançar.</li>\n<li><b>Backup</b>: faça seu primeiro <span class=\"mm-b\">Backup completo</span> e guarde fora do aparelho.</li>\n</ol>\n<div class=\"mm-tip\"><b>💡 Dica:</b> prefere aprender fazendo? Em <b>Configurações → Tutorial guiado</b> o app leva você tela por tela, e o botão <span class=\"mm-b\">Modo Demonstração</span> preenche tudo com dados fictícios para treinar sem risco.</div>\n"},{"id":"tela","icon":"🧭","title":"Conhecendo a tela","html":"\n<h3>No computador</h3>\n<p>O <b>menu lateral</b> fica à esquerda, em três grupos:</p>\n<table class=\"mm-table\"><thead><tr><th>Grupo</th><th>Telas</th></tr></thead><tbody>\n<tr><td>Principal</td><td>Inicial · Pessoas · Agenda &amp; Giras · Financeiro · Comunicação</td></tr>\n<tr><td>Organização</td><td>Festas &amp; Eventos · Estoque &amp; Compras · Fornecedores · Patrimônio · Documentos · Relatórios</td></tr>\n<tr><td>Sistema</td><td>Backup &amp; Proteção · Plano &amp; Assinatura · Configurações</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> se a janela for baixa (notebook), o menu lateral ganha uma <b>barra de rolagem</b> própria. Role para ver todos os itens.</div>\n<p>No <b>topo</b> ficam o nome da casa e a tela atual, a <b>busca</b> (lupa), o <b>sino</b> (pendências e avisos) e o seu perfil (Administrador).</p>\n<h3>No celular</h3>\n<p>A <b>barra inferior</b> traz os módulos principais: <b>Inicial, Pessoas, Agenda &amp; Giras, Financeiro, Estoque &amp; Compras</b> e <b>Mais</b>. Tudo o que não cabe na barra (Comunicação, Festas &amp; Eventos, Documentos, Fornecedores, Patrimônio, Relatórios, Backup &amp; Proteção e Configurações) está em <b>Mais</b>.</p>\n<div class=\"mm-tip\"><b>💡 Dica:</b> não achou uma função? Procure primeiro em <b>Mais</b>.</div>\n<h3>Padrões que se repetem em todo o app</h3>\n<table class=\"mm-table\"><thead><tr><th>Elemento</th><th>Como funciona</th></tr></thead><tbody>\n<tr><td>Botão escuro no topo</td><td>É a ação principal da tela (ex.: <span class=\"mm-b\">Novo cadastro</span>, <span class=\"mm-b\">Novo lançamento</span>).</td></tr>\n<tr><td>Janelas (modais)</td><td>Formulários abrem numa janela com <span class=\"mm-b w\">Cancelar</span> e <span class=\"mm-b\">Salvar</span>. Toque no ✕ ou em Cancelar para fechar sem salvar.</td></tr>\n<tr><td>Busca e filtros</td><td>Campos “Buscar…” filtram a lista enquanto você digita. Abas e botões em pílula filtram por situação.</td></tr>\n<tr><td>PDF</td><td>Quase todas as telas têm botão de PDF. O arquivo abre em outra janela para imprimir ou salvar.</td></tr>\n<tr><td>Máscaras</td><td>Telefones, valores em R$, CPF/CNPJ e CEP são formatados enquanto você digita. Em dinheiro, digite só os números: 8500 vira <b>85,00</b>.</td></tr>\n<tr><td>Datas</td><td>Mostradas como dd/mm/aaaa. Os campos de data usam o seletor do seu aparelho.</td></tr>\n<tr><td>Valores</td><td>Em reais (R$). O botão <span class=\"mm-b w\">Ocultar valores</span>, no Financeiro, esconde os números quando outras pessoas estiverem olhando a tela.</td></tr>\n</tbody></table>\n"},{"id":"inicial","icon":"🏠","title":"Inicial","html":"\n<p>A tela <b>Inicial</b> é a sua central de atenção: mostra o que exige ação sem você precisar abrir cada módulo.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Inicial</b> (primeiro item).</div>\n<table class=\"mm-table\"><thead><tr><th>Bloco</th><th>O que mostra</th></tr></thead><tbody>\n<tr><td>Próxima gira</td><td>O próximo compromisso da agenda, com data, hora e local.</td></tr>\n<tr><td>Avisos importantes</td><td>Alertas que merecem sua atenção, como: <b>chamada pendente</b> de uma gira recente, pessoas com <b>faltas seguidas</b> ou <b>abaixo da meta</b> de frequência, e lembrete de <b>backup externo</b>. Cada aviso é um botão que leva direto à tela certa; os avisos de frequência mostram <b>os nomes</b> das pessoas e abrem a lista já filtrada.</td></tr>\n<tr><td>Precisa de atenção</td><td>Resumo do Financeiro (valor a pagar) e do Estoque (itens abaixo do mínimo).</td></tr>\n<tr><td>Ações rápidas</td><td><span class=\"mm-b\">Nova pessoa</span> · <span class=\"mm-b\">Novo compromisso</span> · <span class=\"mm-b\">Novo lançamento</span> · <span class=\"mm-b\">Programar mensagem</span>.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> comece o dia pela Inicial e termine zerando os avisos. O <b>sino</b> no topo reúne as pendências em qualquer tela.</div>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> se aparecer o aviso “Período gratuito encerrado · Modo Restrito”, veja o capítulo Plano &amp; Assinatura. Seus dados continuam preservados.</div>\n"},{"id":"pessoas","icon":"👥","title":"Pessoas (cadastro)","html":"\n<p><b>Pessoas</b> (antigo “Filhos da Casa”) é o cadastro principal. Ele serve de base para agenda, mensalidades, frequência, comunicação e documentos. O nome do módulo pode ser trocado em <b>Configurações → Terminologia</b>.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Pessoas</b>. A tela tem duas abas: <b>Cadastro</b> (esta) e <b>Frequência</b> (capítulo seguinte).</div>\n<h3>Tipos de pessoa</h3>\n<table class=\"mm-table\"><thead><tr><th>Tipo</th><th>Para quem é</th><th>Contribuição</th></tr></thead><tbody>\n<tr><td>Mensalista</td><td>Quem faz parte da casa e contribui.</td><td>Mensalidade, Valor avulso ou Isento.</td></tr>\n<tr><td>Consulente</td><td>Quem frequenta a assistência e busca atendimento.</td><td>Sem contribuição ou Valor avulso.</td></tr>\n<tr><td>Convidado</td><td>Visitas e convidados.</td><td>Nenhuma.</td></tr>\n<tr><td>Outro</td><td>Qualquer vínculo que não se encaixe nos anteriores.</td><td>Nenhuma.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> só quem é <b>Mensalista com forma “Mensalidade”</b> aparece em Financeiro → Mensalidades e como “Pendente”. Consulentes e convidados <b>nunca</b> aparecem como inadimplentes.</div>\n<h3>Cadastrar uma pessoa</h3>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo cadastro</span> (ou em <span class=\"mm-b\">Nova pessoa</span>, na Inicial).</li>\n<li>Preencha <b>Nome completo</b> e escolha o <b>Tipo de pessoa</b> e a <b>Situação</b> (Ativa, Inativa ou Afastada).</li>\n<li>Informe <b>Telefone</b> e <b>WhatsApp</b> (com DDD; a máscara formata sozinha), <b>E-mail</b>, <b>Nascimento</b> e <b>Data de entrada</b>.</li>\n<li>Escolha a <b>Função / vínculo</b> na lista. Se não encontrar, escolha <b>＋ Outra função (digitar manualmente)</b>, escreva e salve: a nova função fica guardada para os próximos cadastros.</li>\n<li>Preencha o <b>Grupo</b> se a casa trabalha com grupos.</li>\n<li>Na caixa <b>Contribuição</b>, escolha a <b>forma de contribuição</b> (as opções dependem do tipo) e, se houver, o <b>valor</b>. Em branco na mensalidade, vale o valor padrão da casa.</li>\n<li>Em consulentes aparece <b>“Quer receber convite para as giras”</b>. Marque quem pediu para ser avisado.</li>\n<li><b>Controlar frequência</b>: já vem marcado para Mensalistas. Desmarque quem não entra na chamada; marque em outros tipos quando fizer sentido.</li>\n<li>Opcional: <b>Contato de emergência</b> e <b>Observação restrita</b> (anotação interna que <u>nunca</u> sai nos PDFs).</li>\n<li>Toque em <span class=\"mm-b\">Salvar</span>.</li>\n</ol>\n<h3>Funções disponíveis na lista</h3>\n<p>A lista traz cargos <b>gerais</b> (Filho(a) da Casa, Médium, Diretoria, Tesouraria, Secretaria, Voluntário), da <b>Umbanda</b> (Dirigente Espiritual, Pai/Mãe Pequeno(a), Médium de Incorporação, de Corrente/Desenvolvimento e de Sustentação, Cambono, Curimbeiro/Ogã, Zelador(a) de Altar/Peji) e do <b>Candomblé</b> (Ialorixá, Babalorixá, Iyaegbé/Babaegbé, Ialaxé/Babalaxé, Iyakekerê/Babakekerê, Abiã, Iyawô/Cassuté, Ebomi, Alabê, Ogã, Ekedi, Axogum, Iyabassé, Babalossayn, Pejigan, Iyamoro/Dagã/Sidagã, Iyaefun/Babaefun). Funções que você cadastrar manualmente aparecem no grupo “Cadastradas por você”.</p>\n<h3>A lista de pessoas</h3>\n<p>No computador a lista é uma <b>tabela</b> (Nome, Tipo · Função, Aniversário, Contribuição, Contato); no celular, <b>cartões</b>. As duas mostram as mesmas informações.</p>\n<table class=\"mm-table\"><thead><tr><th>Botão / campo</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Buscar</td><td>Procura por nome, telefone ou função.</td></tr>\n<tr><td>Todos · Ativos · Pendentes · Inativos</td><td>Filtra pela situação. “Pendentes” são mensalistas sem a mensalidade do mês.</td></tr>\n<tr><td>Todos os tipos · Mensalistas · Consulentes · Convidados</td><td>Filtra pelo tipo de pessoa (com a contagem de cada um).</td></tr>\n<tr><td>🎂 Aniversariantes do mês</td><td>Abre a lista de aniversários do mês (veja abaixo).</td></tr>\n<tr><td>📅 Agendar atendimento</td><td>Agenda um atendimento de consulente (capítulo Consulentes).</td></tr>\n<tr><td>📣 Convidar consulentes para gira</td><td>Convida consulentes um a um pelo WhatsApp (capítulo Consulentes).</td></tr>\n<tr><td>PDF desta lista</td><td>Gera o PDF exatamente com os filtros que estão na tela.</td></tr>\n<tr><td>WhatsApp</td><td>Aparece para toda pessoa que tem WhatsApp cadastrado. Abre a conversa com uma mensagem pronta (lembrete de mensalidade, se estiver pendente, ou mensagem geral).</td></tr>\n<tr><td>🎂 Parabenizar</td><td>Aparece no dia do aniversário da pessoa e abre o WhatsApp com a mensagem de feliz aniversário.</td></tr>\n<tr><td>Abrir / Abrir ficha</td><td>Abre a ficha individual.</td></tr>\n</tbody></table>\n<h3>Aniversariantes do mês</h3>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b g\">🎂 Aniversariantes do mês</span>. O número ao lado mostra quantos são.</li>\n<li>Troque o <b>Mês</b> no seletor para ver outros meses.</li>\n<li>Em cada nome, <span class=\"mm-b g\">Parabéns</span> abre o WhatsApp com a mensagem pronta; <span class=\"mm-b w\">PDF</span> gera a lista do mês.</li>\n</ol>\n<p>No dia do aniversário, um aviso “Aniversário hoje” aparece também no topo da lista, com o botão <span class=\"mm-b g\">Parabenizar</span>.</p>\n<div class=\"mm-tip\"><b>💡 Dica:</b> preencha o <b>Nascimento</b> de todos: é ele que alimenta os aniversários. Pessoas inativas não entram na lista.</div>\n<h3>Ficha individual</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> Pessoas → <span class=\"mm-b w\">Abrir</span> na linha da pessoa.</div>\n<p>Mostra os dados completos (tipo, função, aniversário, contribuição, <b>frequência dos últimos 3 meses</b>) e o <b>histórico</b> vinculado. Botões: <span class=\"mm-b w\">Editar</span> (também permite excluir), <span class=\"mm-b w\">WhatsApp</span> e <span class=\"mm-b w\">PDF da ficha</span>.</p>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> para quem deixou a casa, prefira marcar como <b>Inativa</b> em vez de excluir: assim o histórico é preservado. O <b>PDF da ficha</b> não inclui a observação restrita.</div>\n"},{"id":"consulentes","icon":"🕯️","title":"Consulentes: atendimento e convites","html":"\n<p>Dois recursos facilitam o dia a dia com a assistência: <b>agendar atendimento</b> (com confirmação pelo WhatsApp) e <b>convidar para as giras</b> sem precisar lembrar de um por um.</p>\n<h3>Agendar atendimento</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> Pessoas → <span class=\"mm-b\">📅 Agendar atendimento</span> (geral) ou <span class=\"mm-b w\">📅 Agendar</span> na linha do consulente. Também na <b>Agenda</b> e em <b>Comunicação</b>.</div>\n<ol class=\"mm-steps\">\n<li>Escolha o <b>Consulente</b> (já vem selecionado se você abriu pela linha dele).</li>\n<li>Informe <b>Data</b> e <b>Horário</b>.</li>\n<li>Escolha a <b>Modalidade</b>:\n <ul><li><b>Presencial:</b> aparece o campo <b>Endereço enviado ao consulente</b>. Ele vem preenchido com o endereço da casa (Configurações → Dados da Casa) e pode ser ajustado.</li>\n <li><b>Online:</b> aparece <b>Link da videochamada (opcional)</b>. Se você ainda não criou o link, deixe em branco: a mensagem avisa que o link será criado e enviado antes do horário. Se já tiver, cole o link e ele segue na mensagem.</li></ul></li>\n<li>Escreva <b>Observações internas</b>, se quiser.</li>\n<li>Toque em <span class=\"mm-b\">Salvar na agenda</span> para só registrar, ou em <span class=\"mm-b g\">Salvar e enviar WhatsApp</span> para registrar e abrir a confirmação pronta no WhatsApp.</li>\n</ol>\n<p>O atendimento fica <b>registrado na Agenda</b> como compromisso do tipo <i>Atendimento</i>, vinculado ao consulente, com status Confirmado.</p>\n<div class=\"mm-tip\"><b>💡 Dica:</b> a mensagem de confirmação traz data, dia da semana, horário e modalidade, com a orientação de chegar 15 minutos antes (presencial) ou de entrar em local tranquilo e com boa conexão (online).</div>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> se o consulente não tiver WhatsApp cadastrado, o atendimento é salvo normalmente, mas a mensagem não pode ser enviada.</div>\n<h3>Convidar consulentes para a gira</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> Pessoas → <span class=\"mm-b\">📣 Convidar consulentes para gira</span>. Também na <b>Agenda</b> e em <b>Comunicação → Mensagens para consulentes</b>.</div>\n<ol class=\"mm-steps\">\n<li>Escolha a <b>Gira</b> na lista (aparecem as próximas giras cadastradas na Agenda). Se não houver nenhuma, cadastre antes na Agenda (tipo <b>Gira</b>).</li>\n<li>Leia e, se quiser, ajuste o texto em <b>Mensagem do convite</b>. Variáveis: <code>{nome}</code>, <code>{evento}</code>, <code>{data}</code>, <code>{hora}</code>, <code>{local}</code> e <code>{casa}</code>. O texto que você ajustar fica salvo para os próximos convites.</li>\n<li>Confira a lista: cada consulente tem uma caixa de seleção. Quem <b>não tem WhatsApp</b> ou <b>prefere não receber convites</b> fica bloqueado e identificado.</li>\n<li>Toque em <span class=\"mm-b\">Enviar para o próximo</span>. O WhatsApp abre com o convite do próximo consulente da fila. Confirme o envio lá, volte ao app e toque de novo. O contador mostra quantos faltam.</li>\n<li>Quem já teve o convite aberto aparece com a data e o selo ✓. Use <span class=\"mm-b w\">Reenviar</span> numa linha para repetir, ou <span class=\"mm-b w\">Limpar marcações</span> para recomeçar a fila.</li>\n</ol>\n<div class=\"mm-tip\"><b>💡 Dica:</b> muitos consulentes esporádicos pedem para ser avisados das giras. Marque <b>“Quer receber convite para as giras”</b> no cadastro de cada um e use o convite toda semana: são poucos toques para avisar todos.</div>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> o WhatsApp abre <b>uma conversa por vez</b>; é uma regra do próprio WhatsApp e do navegador. O app não consegue disparar para todos de uma só vez, e a marcação “aberto” indica que o convite foi preparado, não que a mensagem foi entregue.</div>\n"},{"id":"frequencia","icon":"📋","title":"Frequência e chamada","html":"\n<p>Controle a presença dos médiuns e filhos da casa: faça a <b>chamada</b> na gira, acompanhe o <b>relatório de frequência</b>, defina uma <b>meta</b> e receba <b>alertas</b>.</p>\n<h3>Quem entra na chamada</h3>\n<p>Entram as pessoas com <b>Controlar frequência</b> marcado no cadastro (por padrão, os <b>Mensalistas</b> ativos). Consulentes e convidados ficam de fora, mas dá para <b>incluir outra pessoa</b> na hora da chamada ou ligar o controle no cadastro dela.</p>\n<h3>Fazer a chamada</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> botão <span class=\"mm-b g\">📋 Fazer chamada</span> em <b>Agenda &amp; Giras</b>, em <b>Pessoas → Frequência</b> e nos avisos da <b>Inicial</b>; ou abra o compromisso na Agenda e toque em <span class=\"mm-b w\">📋 Fazer chamada</span>.</div>\n<ol class=\"mm-steps\">\n<li>Escolha o compromisso (a lista mostra os dos últimos 60 dias que contam para a frequência, com o selo “Chamada pendente” ou “Chamada feita”).</li>\n<li>Para cada pessoa, toque no status: <b>Presente</b>, <b>Atrasado</b>, <b>Falta</b> ou <b>Justif.</b> (justificada). Tocar de novo no mesmo status limpa a marcação.</li>\n<li>Atalhos: <span class=\"mm-b w\">✓ Marcar todos presentes</span> (marca só quem ainda está sem status) e <span class=\"mm-b w\">Limpar tudo</span>. Use a busca para achar um nome.</li>\n<li>Acompanhe os contadores no alto: presentes, atrasados, faltas, justificadas e <b>sem marcação</b>.</li>\n<li>Precisa incluir alguém fora da lista (um consulente, por exemplo)? Use <span class=\"mm-b w\">＋ Incluir outra pessoa</span>, no fim da lista.</li>\n<li>A caixa <b>“Esta chamada conta para a frequência”</b> vem marcada conforme o tipo do compromisso. Desmarque numa gira especial que não deva entrar no cálculo.</li>\n<li>Toque em <span class=\"mm-b\">Salvar chamada</span>. O botão <span class=\"mm-b w\">PDF</span> gera a lista de chamada.</li>\n</ol>\n<div class=\"mm-tip\"><b>💡 Dica:</b> a chamada pode ser feita na hora (no celular, com um toque por nome) ou depois, quando o Pai ou a Mãe de Santo tiver a lista. Você pode reabrir e corrigir uma chamada quando quiser: o botão passa a se chamar <b>Ver / editar chamada</b>.</div>\n<h3>Relatório de frequência</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> Pessoas → aba <b>Frequência</b>. Também em Relatórios → Frequência.</div>\n<table class=\"mm-table\"><thead><tr><th>Item</th><th>O que mostra</th></tr></thead><tbody>\n<tr><td>Período</td><td>Mês atual · Últimos 3 meses · Ano atual · Tudo.</td></tr>\n<tr><td>Tipo</td><td>Filtra por tipo de compromisso (Gira, Reunião…).</td></tr>\n<tr><td>Buscar pessoa</td><td>Filtra a lista pelo nome.</td></tr>\n<tr><td>Chamadas no período</td><td>Quantas chamadas foram feitas.</td></tr>\n<tr><td>Frequência média</td><td>Média das porcentagens das pessoas.</td></tr>\n<tr><td>Abaixo da meta</td><td>Quantas pessoas estão abaixo da meta definida.</td></tr>\n<tr><td>Faltas seguidas</td><td>Quantas pessoas estão com o número de faltas seguidas que aciona o alerta.</td></tr>\n<tr><td>Chamadas pendentes</td><td>Compromissos recentes cuja chamada ainda não foi feita, com botão <span class=\"mm-b g\">Fazer chamada</span>.</td></tr>\n<tr><td>Frequência por pessoa</td><td>Porcentagem com barra colorida (verde: dentro da meta; amarelo: perto; vermelho: abaixo), mais o total de presenças, atrasos, faltas e justificadas. Por padrão as pessoas com menor frequência aparecem primeiro.</td></tr>\n<tr><td>Por tipo de compromisso</td><td>Frequência média de cada tipo.</td></tr>\n<tr><td>PDF do relatório</td><td>Gera o relatório com os filtros da tela.</td></tr>\n<tr><td>Ficha</td><td>Abre a ficha da pessoa.</td></tr>\n</tbody></table>\n<h3>Filtros, ordem e destaque</h3>\n<p>Logo abaixo dos indicadores há <b>botões de classificação</b>, cada um com a contagem de pessoas:</p>\n<table class=\"mm-table\"><thead><tr><th>Filtro</th><th>Mostra</th></tr></thead><tbody>\n<tr><td>Todos</td><td>Todas as pessoas com controle de frequência.</td></tr>\n<tr><td>⚠️ Faltas seguidas</td><td>Quem está com o número de faltas seguidas que dispara o alerta (padrão: 3 ou mais).</td></tr>\n<tr><td>Abaixo da meta</td><td>Quem está abaixo da meta de frequência.</td></tr>\n<tr><td>Dentro da meta</td><td>Quem está na meta ou acima.</td></tr>\n<tr><td>Presença total</td><td>Quem tem 100% de presença no período.</td></tr>\n<tr><td>Com faltas · Com atrasos</td><td>Quem teve ao menos uma falta (ou um atraso) no período.</td></tr>\n<tr><td>Sem registro</td><td>Quem não tem nenhuma chamada marcada no período.</td></tr>\n</tbody></table>\n<ul>\n<li><b>Ordenar:</b> Pior frequência primeiro (padrão), Melhor frequência primeiro, Mais faltas, Mais atrasos ou Nome (A–Z).</li>\n<li><b>Período:</b> Últimos 30 dias, Mês atual, Últimos 3 meses, Ano atual ou Tudo. Junto com <b>Tipo</b> e a busca, os filtros se combinam.</li>\n<li>Os cartões <b>Abaixo da meta</b> e <b>faltas seguidas</b>, no topo, também são botões: toque para filtrar.</li>\n</ul>\n<div class=\"mm-tip\"><b>💡 Dica:</b> <b>quem tem faltas seguidas fica sempre fixado no topo da lista</b>, em destaque vermelho, com o nome, o número de faltas e as <b>datas em que faltou</b>, qualquer que seja a ordem escolhida. O aviso da tela Inicial mostra os nomes e, ao tocar, abre a lista já filtrada.</div>\n<h3>Regras e meta</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> botão <span class=\"mm-b w\">⚙️ Regras e meta</span> (aba Frequência) ou <b>Configurações → Frequência → Configurar</b>.</div>\n<table class=\"mm-table\"><thead><tr><th>Regra</th><th>O que define</th></tr></thead><tbody>\n<tr><td>Meta mínima (%)</td><td>Frequência esperada. Padrão: 75%.</td></tr>\n<tr><td>Avisar após quantas faltas seguidas</td><td>Padrão: 3.</td></tr>\n<tr><td>Mínimo de chamadas para avisar “abaixo da meta”</td><td>Evita alarme falso no começo. Padrão: 3.</td></tr>\n<tr><td>Falta justificada conta como</td><td><b>Não entra no cálculo</b> (padrão), <b>Presença</b> ou <b>Falta</b>.</td></tr>\n<tr><td>Tipos que contam</td><td>Quais tipos de compromisso entram na frequência. Padrão: Gira e Reunião. Para incluir Desenvolvimento, Mutirão etc., crie esses tipos em Configurações → Listas de apoio e marque-os aqui.</td></tr>\n</tbody></table>\n<h3>Como a porcentagem é calculada</h3>\n<p><b>Frequência = presenças ÷ chamadas consideradas.</b> <b>Atraso conta como presença.</b> Falta conta como falta. A justificada segue a regra escolhida acima. Quem ficou <b>sem marcação</b> numa chamada não entra naquela conta.</p>\n<p><i>Exemplo:</i> em 8 giras, uma pessoa teve 5 presenças, 1 atraso, 1 falta e 1 justificada. Com a justificada “neutra”: (5+1) ÷ (5+1+1) = <b>86%</b>. Se a justificada contar como falta: 6 ÷ 8 = <b>75%</b>.</p>\n<h3>Alertas</h3>\n<ul>\n<li><b>Na Inicial:</b> “Chamada pendente”, “N pessoas com 3+ faltas seguidas” e “N pessoas abaixo da meta”. Cada aviso leva direto à tela certa.</li>\n<li><b>Na lista de frequência:</b> selos “3 faltas seguidas” e “Abaixo da meta” ao lado do nome.</li>\n</ul>\n<h3>💬 Sentimos sua falta</h3>\n<p>Em quem está com alerta e tem WhatsApp aparece o botão <span class=\"mm-b g\">💬 Sentimos sua falta</span>. Ele abre o WhatsApp com uma mensagem acolhedora: pergunta como a pessoa está, oferece apoio e convida para voltar. Você confirma o envio.</p>\n<div class=\"mm-tip\"><b>💡 Dica:</b> use o alerta para <b>acolher</b>, não para cobrar. Muitas ausências têm motivo de saúde, trabalho ou família.</div>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> as chamadas antigas não existem no app. O relatório passa a valer a partir da primeira chamada que você registrar. Os dados de frequência ficam só na área administrativa.</div>\n"},{"id":"agenda","icon":"📅","title":"Agenda & Giras","html":"\n<p>A Agenda organiza giras, reuniões, tarefas, compras e atendimentos.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Agenda &amp; Giras</b> (também na barra inferior do celular).</div>\n<h3>Formas de ver a agenda</h3>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que mostra</th></tr></thead><tbody>\n<tr><td>Calendário</td><td>Visão mensal em grade (a principal).</td></tr>\n<tr><td>Dia · Semana · Quinzenal · Mensal · Trimestral · Ano</td><td>Listas de compromissos para o período escolhido.</td></tr>\n<tr><td>Data inicial / Data final + Aplicar</td><td>Período personalizado. <span class=\"mm-b w\">Limpar</span> volta ao padrão.</td></tr>\n<tr><td>‹ Hoje ›</td><td>Navega entre meses; <b>Hoje</b> volta ao dia atual.</td></tr>\n</tbody></table>\n<h3>Lendo o calendário</h3>\n<ul>\n<li>Dias com compromisso têm <b>fundo dourado</b>, um <b>ponto laranja</b> e um <b>número</b> no canto com a quantidade de compromissos.</li>\n<li>O dia <b>selecionado</b> fica <b>verde</b>. O dia de hoje tem o número num círculo escuro.</li>\n<li>Abaixo do calendário aparece <b>“Compromissos de dd/mm/aaaa”</b> com os do dia selecionado e o botão <span class=\"mm-b w\">Abrir</span>.</li>\n</ul>\n<h3>Cadastrar um compromisso</h3>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo compromisso</span> (ou em <b>Novo compromisso</b> na Inicial).</li>\n<li>Preencha <b>Título</b>, <b>Tipo</b> (Gira, Reunião, Festa, Evento, Tarefa, Compra, Atendimento, Manutenção, Administrativo, Outro; a lista vem das Listas de apoio) e <b>Status</b>.</li>\n<li>Informe <b>Data</b>, <b>Hora</b>, <b>Final</b>, <b>Local</b> e <b>Responsável</b>.</li>\n<li>Descreva os <b>Materiais necessários</b> e as <b>Observações</b>. Salve.</li>\n</ol>\n<h3>Detalhe do compromisso</h3>\n<p>Ao tocar em <span class=\"mm-b w\">Abrir</span> você vê data e horário, local, responsável, materiais, <b>participantes</b>, financeiro vinculado e observações. Botões:</p>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>📋 Fazer chamada</td><td>Abre a chamada deste compromisso (veja Frequência e chamada).</td></tr>\n<tr><td>Mensagem</td><td>Prepara o lembrete do compromisso para o WhatsApp.</td></tr>\n<tr><td>Editar</td><td>Altera os dados do compromisso.</td></tr>\n</tbody></table>\n<h3>Atalhos da Agenda</h3>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>📋 Fazer chamada</td><td>Escolhe uma gira recente e abre a chamada.</td></tr>\n<tr><td>📅 Agendar atendimento</td><td>Agenda atendimento de consulente.</td></tr>\n<tr><td>📣 Convidar consulentes para gira</td><td>Abre a fila de convites.</td></tr>\n<tr><td>PDF semana · PDF mês · PDF ano</td><td>Gera o PDF da agenda no período.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> para a chamada contar na frequência, o compromisso precisa ser de um tipo marcado em Frequência → Regras e meta (por padrão, <b>Gira</b> e <b>Reunião</b>).</div>\n"},{"id":"eventos","icon":"🎉","title":"Festas & Eventos","html":"\n<p>Use este módulo quando uma festa ou evento precisar de <b>organização própria</b>, com receitas e despesas ligadas a ele. A <b>Agenda</b> organiza compromissos do dia a dia; <b>Festas &amp; Eventos</b> organiza um projeto maior.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Festas &amp; Eventos</b> (no celular: Mais → Festas &amp; Eventos).</div>\n<table class=\"mm-table\"><thead><tr><th>Botão / campo</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Novo evento</td><td>Cadastra um evento (mesmo formulário do compromisso: título, tipo, status, data, hora, local, responsável, materiais, observações).</td></tr>\n<tr><td>Data inicial / final + Aplicar / Limpar</td><td>Filtra os eventos por período, útil para consultar programações antigas ou futuras.</td></tr>\n<tr><td>PDF</td><td>Gera o PDF da lista de eventos.</td></tr>\n<tr><td>Abrir</td><td>Abre o detalhe do evento.</td></tr>\n</tbody></table>\n<p>Cada evento mostra o <b>resumo financeiro</b> (entradas e saídas ligadas a ele). Para ligar um lançamento a um evento, escolha o evento no campo <b>Evento vinculado</b> ao criar o lançamento no Financeiro.</p>\n<div class=\"mm-tip\"><b>💡 Dica:</b> vincule despesas e contribuições ao evento: no fim da festa você sabe exatamente quanto custou e quanto entrou.</div>\n"},{"id":"financeiro","icon":"💰","title":"Financeiro","html":"\n<p>O Financeiro reúne receitas, despesas, contas, fundos, mensalidades e a prestação de contas, tudo ligado a pessoas e eventos.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Financeiro</b> (também na barra inferior do celular).</div>\n<h3>O painel do topo</h3>\n<table class=\"mm-table\"><thead><tr><th>Item</th><th>O que mostra</th></tr></thead><tbody>\n<tr><td>Entradas recebidas</td><td>Receitas já recebidas.</td></tr>\n<tr><td>Saídas pagas</td><td>Despesas já pagas.</td></tr>\n<tr><td>Resultado</td><td>Recebido − pago.</td></tr>\n<tr><td>Pendências</td><td>A receber + a pagar.</td></tr>\n<tr><td>Data inicial / final + Aplicar</td><td>Filtra indicadores e lançamentos por período. <span class=\"mm-b w\">Limpar</span> remove o filtro. Os saldos de Caixa &amp; Bancos e Fundos continuam acumulados.</td></tr>\n<tr><td>Ocultar valores</td><td>Esconde os números na tela.</td></tr>\n<tr><td>PDF semana · mês · ano</td><td>Relatório financeiro do período.</td></tr>\n<tr><td>Novo lançamento</td><td>Registra receita, despesa ou transferência.</td></tr>\n</tbody></table>\n<h3>Novo lançamento</h3>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo lançamento</span> e escolha o <b>Tipo</b>: <b>Receita</b>, <b>Despesa</b> ou <b>Transferência</b>.</li>\n<li>Informe <b>Data</b>, <b>Competência</b> (mês a que o valor se refere) e <b>Status</b> (Recebido, Pago, Concluído, Pendente, Vencido, Cancelado…).</li>\n<li>Escreva a <b>Descrição</b> e escolha <b>Categoria</b>, <b>Subcategoria</b> e <b>Centro de custo</b>.</li>\n<li>Em <b>Fundo / finalidade</b>, vincule o valor a um fundo (opcional).</li>\n<li>Escolha a <b>Conta</b> (Caixa físico, Conta corrente, Pix…). Na <b>Transferência</b> aparecem <b>Conta origem</b> e <b>Conta destino</b>.</li>\n<li>Digite o <b>Valor</b> (só os números: 8500 vira 85,00).</li>\n<li>Vincule uma <b>Pessoa</b> e/ou um <b>Evento</b> e informe a <b>Forma de pagamento</b> e <b>Observações</b>, se quiser. Salve.</li>\n</ol>\n<div class=\"mm-tip\"><b>💡 Dica:</b> quanto mais vínculos (pessoa, evento, fundo, centro de custo), mais úteis ficam os relatórios.</div>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> transferência entre contas <b>não é receita nem despesa</b>: só muda o dinheiro de lugar. Os valores são guardados em centavos e mostrados em R$.</div>\n<h3>As abas do Financeiro</h3>\n<table class=\"mm-table\"><thead><tr><th>Aba</th><th>Para que serve</th></tr></thead><tbody>\n<tr><td>Movimentações</td><td>Todos os lançamentos, do mais recente ao mais antigo. Cada um tem o botão <span class=\"mm-b w\">Editar</span>.</td></tr>\n<tr><td>Contas a pagar</td><td>Despesas pendentes ou vencidas.</td></tr>\n<tr><td>Contas a receber</td><td>Receitas pendentes.</td></tr>\n<tr><td>Caixa &amp; Bancos</td><td>As contas da casa (Caixa físico, Conta corrente, Pix) com o <b>saldo acumulado</b> calculado pelos lançamentos.</td></tr>\n<tr><td>Fundos</td><td>Recursos separados por finalidade (veja abaixo).</td></tr>\n<tr><td>Mensalidades</td><td>Acompanhamento da contribuição mensal dos Mensalistas (veja abaixo).</td></tr>\n<tr><td>Centros de custo</td><td>Entradas, saídas e resultado de cada centro (Administração, Manutenção, Cozinha, Festa, Gira, Material, Patrimônio, Outros).</td></tr>\n<tr><td>Conciliação</td><td>Confere o saldo calculado com o saldo real da conta.</td></tr>\n<tr><td>Orçamento</td><td>Compara o valor previsto com o realizado por centro de custo.</td></tr>\n<tr><td>Prestação de contas</td><td>Gera o relatório gerencial do mês em PDF.</td></tr>\n</tbody></table>\n<h3>Fundos</h3>\n<p>Um <b>fundo</b> separa o dinheiro por finalidade (Obras, Manutenção, Festa de Ogum…) sem criar nova conta bancária.</p>\n<table class=\"mm-table\"><thead><tr><th>Botão / campo</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Novo fundo</td><td>Cria um fundo: <b>Nome</b>, <b>Saldo inicial</b>, <b>Meta</b>, <b>Status</b> (Ativo/Arquivado) e <b>Descrição / finalidade</b>.</td></tr>\n<tr><td>Transferir</td><td>Move valor de um fundo para outro (Origem, Destino, Data, Valor e Motivo). Não movimenta o Caixa &amp; Bancos.</td></tr>\n<tr><td>Abrir um fundo</td><td>Mostra saldo, entradas, saídas, meta e % alcançado, movimentações vinculadas e transferências internas. Botões: Editar, Transferir, PDF.</td></tr>\n<tr><td>PDF</td><td>Relatório de todos os fundos (saldos, metas e arquivados).</td></tr>\n</tbody></table>\n<h3>Mensalidades</h3>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> Financeiro → aba <b>Mensalidades</b>.</div>\n<p>Lista apenas as pessoas do tipo <b>Mensalista</b> com forma de contribuição <b>Mensalidade</b>. As pílulas mostram <b>Cadastrados</b>, <b>Em dia</b> e <b>Pendentes</b> da competência atual.</p>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Registrar</td><td>Abre um lançamento de receita já preenchido (categoria Mensalidade, competência atual, valor da pessoa ou o padrão da casa).</td></tr>\n<tr><td>Lembrar</td><td>Abre o WhatsApp com o lembrete de mensalidade pendente.</td></tr>\n<tr><td>PDF pendentes · em dia · geral</td><td>Relatórios da competência, com valores e total a receber.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> o valor padrão da mensalidade fica em <b>Configurações → Listas de apoio</b>. Para um valor diferente, preencha o valor no cadastro da pessoa. Para não usar o controle, desligue a chave <b>Mensalidades</b> em Configurações.</div>\n<h3>Conciliação, Orçamento e Prestação de contas</h3>\n<ul>\n<li><b>Conciliação:</b> em <span class=\"mm-b w\">Conciliar</span>, informe <b>Data</b>, <b>Saldo real (R$)</b> e <b>Observação</b>. O app compara com o saldo calculado.</li>\n<li><b>Orçamento:</b> em <span class=\"mm-b w\">Definir</span>, informe o valor previsto do mês para o centro de custo. O app mostra Previsto, Realizado e % utilizado.</li>\n<li><b>Prestação de contas:</b> <span class=\"mm-b\">Gerar PDF</span> cria o relatório do mês com movimentações detalhadas, categorias, pessoa/evento vinculado, conta, status, resultado por centro de custo e pendências em aberto.</li>\n</ul>\n"},{"id":"comunicacao","icon":"💬","title":"Comunicação e WhatsApp","html":"\n<p>Prepare mensagens e lembretes para as pessoas cadastradas. O app monta o texto e <b>abre o WhatsApp</b>; o envio final é sempre feito por você.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Comunicação</b> (no celular: Mais → Comunicação).</div>\n<table class=\"mm-table\"><thead><tr><th>Botão / bloco</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Nova mensagem</td><td>Programa uma mensagem: <b>Título</b>, <b>Destinatários</b> (Pendentes, Todos ativos, Escalados/participantes ou uma Pessoa), <b>Data</b>, <b>Hora</b> e <b>Mensagem</b>. Toque em <span class=\"mm-b\">Programar</span>.</td></tr>\n<tr><td>Modelos rápidos</td><td>Mensalidade · Gira / evento · Escala · Agradecimento: textos prontos para ajustar.</td></tr>\n<tr><td>Mensagens para consulentes</td><td><b>Convite para gira</b> (fila “enviar para o próximo”) e <b>Agendamento de atendimento</b>.</td></tr>\n<tr><td>Abrir</td><td>Abre uma mensagem programada.</td></tr>\n<tr><td>PDF das mensagens</td><td>Lista das mensagens em PDF.</td></tr>\n</tbody></table>\n<h3>Variáveis nas mensagens</h3>\n<p>Escreva <code>{nome}</code> para o nome da pessoa, <code>{casa}</code> para o nome da casa, e <code>{data}</code> / <code>{hora}</code> para o compromisso. O app troca pelos dados reais.</p>\n<h3>Atalhos de WhatsApp em outras telas</h3>\n<ul>\n<li><b>Pessoas:</b> botão WhatsApp, 🎂 Parabenizar e “Sentimos sua falta”.</li>\n<li><b>Mensalidades:</b> botão Lembrar.</li>\n<li><b>Agenda:</b> botão Mensagem no detalhe do compromisso.</li>\n<li><b>Consulentes:</b> confirmação de atendimento e convite de gira.</li>\n<li><b>Estoque e Fornecedores:</b> solicitação de lista de reposição, cotação e confirmação de pedido.</li>\n</ul>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> o WhatsApp abre uma conversa por vez e você confirma cada envio. No <b>Modo Demonstração</b>, as mensagens vão só para o WhatsApp do administrador, nunca para pessoas reais.</div>\n"},{"id":"estoque","icon":"📦","title":"Estoque & Compras","html":"\n<p>Controle os materiais consumíveis da casa (velas, ervas, bebidas, limpeza…) e organize as compras: <b>estoque → reposição → cotação → pedido → recebimento</b>.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Estoque &amp; Compras</b> (também na barra inferior do celular).</div>\n<h3>Itens de estoque</h3>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo item</span>.</li>\n<li>Informe <b>Item</b>, <b>Categoria</b> (Velas, Limpeza, Cozinha, Materiais, Ervas, Bebidas, Outros…) e <b>Unidade</b>.</li>\n<li>Preencha <b>Quantidade atual</b>, <b>Estoque mínimo</b> e <b>Estoque ideal</b> (base para a sugestão de reposição).</li>\n<li>Informe o <b>Custo unitário</b> e o <b>Fornecedor preferencial</b>. Salve.</li>\n</ol>\n<p>O app classifica cada item como <b>Em dia</b>, <b>Baixo</b>, <b>Crítico</b> ou <b>Zerado</b>. As pílulas no topo filtram por esses estados e mostram a contagem de cada um.</p>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Movimentar</td><td>Registra <b>Entrada</b>, <b>Saída</b> ou <b>Ajuste</b> de quantidade, com <b>Quantidade</b> e <b>Motivo</b>. Atualiza o saldo e guarda o histórico.</td></tr>\n<tr><td>Editar</td><td>Altera os dados do item.</td></tr>\n<tr><td>Selecionar reposição</td><td>Marca os itens que precisam ser comprados e abre a <b>lista de reposição</b>.</td></tr>\n<tr><td>Cotações</td><td>Compara fornecedores para uma compra.</td></tr>\n<tr><td>Pedidos</td><td>Acompanha pedidos e recebimentos.</td></tr>\n<tr><td>Relatórios</td><td>Relatórios de estoque (inventário, mínimo e movimentações) em PDF.</td></tr>\n</tbody></table>\n<h3>Lista de reposição</h3>\n<p>Filtre itens baixos, críticos ou zerados, selecione os necessários e o app gera uma lista <b>agrupada por fornecedor</b>, que pode virar PDF, mensagem de WhatsApp ou o início de uma cotação. A sugestão de compra usa o <b>estoque ideal</b>.</p>\n<h3>Cotações</h3>\n<p>Crie uma cotação, selecione fornecedores e registre <b>subtotal, frete, prazo, condição de pagamento e observações</b> de cada um. O comparativo destaca o <b>melhor total</b> e o <b>menor prazo</b>.</p>\n<h3>Pedidos e recebimento</h3>\n<p>Transforme uma proposta em pedido, confirme, <b>receba parcial ou totalmente</b> e acompanhe o que falta chegar. O recebimento <b>atualiza o estoque</b>. Ao concluir, você pode gerar a despesa no Financeiro sem duplicá-la.</p>\n<div class=\"mm-tip\"><b>💡 Dica:</b> cadastre primeiro os <b>Fornecedores</b>: eles alimentam a reposição, a cotação e os pedidos.</div>\n"},{"id":"fornecedores","icon":"🚚","title":"Fornecedores","html":"\n<p>A base das compras: cadastre quem fornece os materiais da casa.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Fornecedores</b> (no celular: Mais → Fornecedores).</div>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo fornecedor</span>.</li>\n<li>Preencha <b>Nome / fornecedor</b>, <b>Empresa</b>, <b>CPF/CNPJ</b> (a máscara formata sozinha), <b>Telefone</b>, <b>WhatsApp</b> e <b>E-mail</b>.</li>\n<li>Informe <b>Categorias / itens fornecidos</b>, <b>Pix</b>, <b>Prazo médio de entrega</b>, <b>Frete</b>, <b>Condição de pagamento</b> e <b>Pedido mínimo</b>.</li>\n<li>Defina o <b>Status</b> (Ativo, Pausado ou Inativo) e se é <b>Fornecedor preferencial</b>. Salve.</li>\n</ol>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Todos · Ativos · Preferenciais · Pausados · Inativos</td><td>Filtram a lista (com a contagem de cada grupo).</td></tr>\n<tr><td>Editar</td><td>Altera os dados do fornecedor.</td></tr>\n<tr><td>PDF</td><td>Cadastro e condições comerciais em PDF.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> o <b>fornecedor preferencial</b> de cada item de estoque alimenta a lista de reposição e as cotações.</div>\n"},{"id":"patrimonio","icon":"🏛️","title":"Patrimônio","html":"\n<p>Registre os <b>bens duráveis</b> da casa: atabaques, caixas de som, geladeira, mesas, imagens… O <b>Estoque</b> controla o que se consome; o <b>Patrimônio</b> controla o que permanece.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Patrimônio</b> (no celular: Mais → Patrimônio).</div>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo bem</span>.</li>\n<li>Informe <b>Nome do bem</b>, <b>Categoria</b>, <b>Código interno</b>, data de <b>Aquisição</b>, <b>Valor</b>, <b>Localização</b>, <b>Estado</b> e <b>Responsável</b>. Salve.</li>\n</ol>\n<table class=\"mm-table\"><thead><tr><th>Botão</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Editar</td><td>Altera os dados do bem.</td></tr>\n<tr><td>PDF do patrimônio</td><td>Lista de bens com local, estado, valores, responsável e total.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> atribua um <b>responsável</b> a cada bem importante e atualize o <b>estado</b> após manutenções.</div>\n"},{"id":"documentos","icon":"🗂️","title":"Documentos","html":"\n<p>Guarde atas, recibos, comprovantes e outros arquivos administrativos.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Documentos</b> (no celular: Mais → Documentos).</div>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Novo documento</span>.</li>\n<li>Preencha <b>Título</b>, <b>Categoria</b> (Atas, Financeiro, Recibos, Comprovantes, Fornecedores…) e <b>Data</b>.</li>\n<li>Vincule uma <b>Pessoa</b> e/ou um <b>Evento</b>, anexe o <b>Arquivo</b> (limite de <b>10 MB</b> por anexo) e escreva <b>Observações</b>. Salve.</li>\n</ol>\n<table class=\"mm-table\"><thead><tr><th>Botão / campo</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Data inicial / final + Aplicar / Limpar</td><td>Filtra por período, usando a data informada no cadastro do documento.</td></tr>\n<tr><td>Abrir</td><td>Abre o documento.</td></tr>\n<tr><td>PDF</td><td>Lista de documentos arquivados em PDF.</td></tr>\n</tbody></table>\n<div class=\"mm-tip\"><b>💡 Dica:</b> use títulos claros (“Ata da reunião de outubro”) e vincule à pessoa ou ao evento: fica fácil encontrar depois.</div>\n"},{"id":"relatorios","icon":"📊","title":"Relatórios e PDFs","html":"\n<p>A central de relatórios reúne os PDFs do app. Eles usam a <b>identidade da casa</b> (nome, logo e o texto de rodapé configurado em Dados da Casa) e a assinatura “MEU TERREIRO APP”.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Relatórios</b> (no celular: Mais → Relatórios). Quase todas as telas também têm o próprio botão de PDF.</div>\n<table class=\"mm-table\"><thead><tr><th>Relatório</th><th>O que traz</th><th>Onde gerar</th></tr></thead><tbody>\n<tr><td>Financeiro / Prestação de contas</td><td>Movimentações, centros de custo, contas e pendências (semana, mês ou ano).</td><td>Relatórios · Financeiro</td></tr>\n<tr><td>Estoque &amp; Compras</td><td>Inventário, mínimos, movimentações, reposição, cotação e pedido.</td><td>Relatórios · Estoque</td></tr>\n<tr><td>Pessoas</td><td>Cadastros, função, situação e contribuição. Também a <b>lista filtrada</b> da tela Pessoas e a <b>ficha individual</b>.</td><td>Relatórios · Pessoas; Pessoas; ficha</td></tr>\n<tr><td>Agenda &amp; Eventos</td><td>Compromissos por período.</td><td>Relatórios · Agenda; Agenda; Festas &amp; Eventos</td></tr>\n<tr><td>Frequência</td><td>% por pessoa, chamadas realizadas e regras. Também a <b>lista de chamada</b> de cada gira.</td><td>Pessoas → Frequência; chamada</td></tr>\n<tr><td>Aniversariantes do mês</td><td>Datas de nascimento e contatos.</td><td>Aniversariantes (🎂); Relatórios</td></tr>\n<tr><td>Mensalidades</td><td>Pendentes, em dia ou geral, com valores e competência.</td><td>Financeiro → Mensalidades; Relatórios</td></tr>\n<tr><td>Patrimônio</td><td>Bens, local, estado e valores.</td><td>Patrimônio; Relatórios</td></tr>\n<tr><td>Fundos financeiros</td><td>Saldos, metas e fundos arquivados.</td><td>Financeiro → Fundos; Relatórios</td></tr>\n<tr><td>Fornecedores</td><td>Cadastro e condições comerciais.</td><td>Fornecedores; Relatórios</td></tr>\n<tr><td>Documentos</td><td>Lista de documentos arquivados.</td><td>Documentos; Relatórios</td></tr>\n<tr><td>Comunicação</td><td>Mensagens programadas e enviadas.</td><td>Comunicação; Relatórios</td></tr>\n</tbody></table>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> o PDF abre em uma nova janela. Se nada aparecer, <b>permita pop-ups</b> para o app no navegador. A <b>Observação restrita</b> das pessoas nunca é incluída nos PDFs.</div>\n<div class=\"mm-tip\"><b>💡 Dica:</b> personalize o texto do rodapé em <b>Configurações → Dados da Casa</b> (CNPJ, telefone, endereço…): ele sai em todos os PDFs.</div>\n"},{"id":"backup","icon":"🛡️","title":"Backup & Proteção","html":"\n<p>Seus dados ficam só no aparelho; por isso o backup é essencial. O importante não é apenas exportar: é <b>conseguir restaurar</b>.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Backup &amp; Proteção</b> (no celular: Mais → Backup &amp; Proteção). Continua disponível mesmo no Modo Restrito.</div>\n<table class=\"mm-table\"><thead><tr><th>Bloco</th><th>O que é</th></tr></thead><tbody>\n<tr><td>Integridade</td><td>Mostra que a cópia principal e o espelho de contingência estão íntegros, com um código de verificação (checksum).</td></tr>\n<tr><td>Pontos automáticos</td><td>O app cria pontos de restauração sozinho: diários, semanais e mensais.</td></tr>\n<tr><td>Backup externo</td><td><span class=\"mm-b\">Backup completo</span> baixa um arquivo com todos os seus dados. <span class=\"mm-b w\">Restaurar</span> carrega um arquivo de backup. Mostra também a data do último backup verificado.</td></tr>\n<tr><td>Pontos de restauração</td><td>Lista dos pontos criados. <span class=\"mm-b w\">Criar ponto agora</span> cria um ponto na hora (faça antes de mudanças grandes).</td></tr>\n</tbody></table>\n<h3>Como fazer um bom backup</h3>\n<ol class=\"mm-steps\">\n<li>Toque em <span class=\"mm-b\">Backup completo</span> e salve o arquivo.</li>\n<li>Guarde uma cópia <b>fora do aparelho</b> (e-mail, nuvem, pen drive).</li>\n<li>Repita toda semana e antes de atualizar o app.</li>\n</ol>\n<h3>Levar os dados para outro aparelho</h3>\n<p>Faça o <b>Backup completo</b> no aparelho antigo, abra o app no novo, entre em Backup &amp; Proteção e use <span class=\"mm-b w\">Restaurar</span>.</p>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> <b>Restaurar substitui os dados atuais</b> do aparelho pelos do arquivo. Crie um ponto de restauração antes, se quiser poder voltar.</div>\n"},{"id":"plano","icon":"🏷️","title":"Plano & Assinatura","html":"\n<p>Acompanhe o período gratuito, a validade do Plano PRO e ative sua assinatura.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Plano &amp; Assinatura</b> (ou o botão <span class=\"mm-b\">Ativar PRO</span> na tela Mais, no celular).</div>\n<table class=\"mm-table\"><thead><tr><th>Item</th><th>Como funciona</th></tr></thead><tbody>\n<tr><td>Período gratuito</td><td>30 dias por navegador/aparelho.</td></tr>\n<tr><td>Modo Restrito</td><td>Após o período gratuito, sem PRO ativo: os dados são preservados, mas os módulos operacionais ficam bloqueados. Backup, restauração, configurações e assinatura continuam liberados.</td></tr>\n<tr><td>ID do aparelho</td><td>Código no formato <b>AP-XXXX</b>, exclusivo do seu aparelho. Informe-o ao solicitar o código.</td></tr>\n<tr><td>Código de ativação</td><td>Código MTR vinculado ao ID do aparelho. Digite-o na tela para liberar o PRO.</td></tr>\n<tr><td>Planos</td><td>30 dias (promocional), 6 meses e 12 meses. Os valores atuais aparecem na própria tela de planos.</td></tr>\n</tbody></table>\n<ol class=\"mm-steps\">\n<li>Abra <b>Plano &amp; Assinatura</b> e escolha o plano.</li>\n<li>Toque em <span class=\"mm-b g\">Solicitar código no WhatsApp</span>: a mensagem vai pronta (informe também o ID do aparelho).</li>\n<li>Receba o código MTR e informe na tela de ativação.</li>\n</ol>\n<div class=\"mm-tip\"><b>💡 Dica:</b> o código vale para o aparelho cujo ID foi informado. Para usar em outro aparelho, solicite um novo código com o ID dele.</div>\n"},{"id":"configuracoes","icon":"⚙️","title":"Configurações","html":"\n<p>Personalize o app e acesse as ferramentas de apoio.</p>\n<div class=\"mm-where\"><b>📍 Onde fica:</b> menu → <b>Configurações</b> (no celular: Mais → Configurações).</div>\n<table class=\"mm-table\"><thead><tr><th>Item</th><th>O que faz</th></tr></thead><tbody>\n<tr><td>Dados da Casa</td><td><span class=\"mm-b w\">Editar</span>: nome da casa, telefone, WhatsApp, e-mail, cidade, endereço, <b>logo</b> e <b>dados de rodapé dos PDFs</b> (ex.: CNPJ). O endereço é usado nas confirmações de atendimento presencial.</td></tr>\n<tr><td>Listas de apoio</td><td><span class=\"mm-b w\">Configurar</span>: valor padrão da mensalidade, categorias financeiras, centros de custo, tipos de evento e categorias de estoque. Elas alimentam os campos dos formulários (criar “Mutirão” em Tipos de evento faz essa opção aparecer ao cadastrar um compromisso).</td></tr>\n<tr><td>Terminologia</td><td><span class=\"mm-b w\">Alterar</span>: nome do módulo de pessoas (ex.: Pessoas, Filhos da Casa, Membros, Integrantes). Muda só o nome na interface.</td></tr>\n<tr><td>Tutorial guiado</td><td><span class=\"mm-b w\">Iniciar / Continuar</span>: passo a passo dentro do app. A etapa fica salva.</td></tr>\n<tr><td>Tutorial completo (manual detalhado)</td><td><span class=\"mm-b w\">Abrir manual</span>: este manual.</td></tr>\n<tr><td>Modo Demonstração</td><td><span class=\"mm-b w\">Exibir DEMO</span>: preenche o app com dados fictícios para treinar ou apresentar. Seus dados reais ficam preservados e as mudanças feitas na demonstração são descartadas ao sair.</td></tr>\n<tr><td>Mensalidades</td><td>Chave que liga ou desliga o controle de mensalidades da casa.</td></tr>\n<tr><td>Segurança</td><td>Chave <b>Bloqueio por PIN</b> (4 a 8 números) para proteger o acesso neste aparelho. Com o PIN ativo aparece <span class=\"mm-b w\">Alterar PIN</span>.</td></tr>\n<tr><td>Backup &amp; Proteção</td><td>Atalho para a central de backup.</td></tr>\n<tr><td>Plano &amp; Assinatura</td><td>Atalho para o plano.</td></tr>\n<tr><td>Termos &amp; Privacidade</td><td>Leia os Termos de Uso e a Política de Privacidade a qualquer momento.</td></tr>\n<tr><td>Frequência</td><td><span class=\"mm-b w\">Configurar</span>: meta, faltas seguidas, regra da falta justificada e tipos de compromisso que contam na chamada.</td></tr>\n<tr><td>Auditoria</td><td>Registro das últimas ações feitas no app: o que foi feito, em qual módulo e quando.</td></tr>\n</tbody></table>\n<div class=\"mm-warn\"><b>⚠️ Atenção:</b> os dados pessoais cadastrados no app (inclusive religião e vínculos) são sensíveis. Mantenha o app protegido com PIN no aparelho e compartilhe backups apenas com quem for responsável pela casa.</div>\n"},{"id":"dicas","icon":"🌟","title":"Dicas profissionais e rotinas","html":"\n<h3>Rotina da semana</h3>\n<table class=\"mm-table\"><thead><tr><th>Quando</th><th>O que fazer no app</th></tr></thead><tbody>\n<tr><td>Segunda</td><td>Abra a <b>Inicial</b>, resolva os avisos e confira a <b>Agenda</b> da semana.</td></tr>\n<tr><td>Antes da gira</td><td>Use <b>📣 Convidar consulentes para gira</b> e confirme escalas e materiais no compromisso.</td></tr>\n<tr><td>Na gira</td><td>Faça a <b>chamada</b> pelo celular (um toque por nome).</td></tr>\n<tr><td>Depois da gira</td><td>Lance as contribuições e despesas, dê <b>Movimentar</b> nos itens de estoque usados.</td></tr>\n<tr><td>Sexta</td><td>Veja as <b>Mensalidades pendentes</b> e envie os lembretes com <b>Lembrar</b>.</td></tr>\n</tbody></table>\n<h3>Rotina do mês</h3>\n<ul>\n<li>Revise <b>Frequência</b> (últimos 3 meses) e acolha quem tem alerta com <b>💬 Sentimos sua falta</b>.</li>\n<li>Faça a <b>Conciliação</b> das contas e gere a <b>Prestação de contas</b> do mês.</li>\n<li>Gere a <b>lista de reposição</b> do estoque e as cotações.</li>\n<li>Faça o <b>Backup completo</b> e guarde fora do aparelho.</li>\n</ul>\n<h3>Boas práticas</h3>\n<ul>\n<li>Preencha <b>WhatsApp</b> e <b>Nascimento</b> de todos: habilita mensagens e aniversários.</li>\n<li>Use <b>Listas de apoio</b> para padronizar categorias e centros de custo antes de lançar.</li>\n<li>Vincule lançamentos a <b>pessoas, eventos e fundos</b>.</li>\n<li>Prefira marcar como <b>Inativa</b> a excluir quem saiu.</li>\n<li>Treine novos usuários no <b>Modo Demonstração</b>.</li>\n<li>Combine com a diretoria se a falta <b>justificada</b> conta ou não na meta, e registre em Frequência → Regras e meta.</li>\n</ul>\n"},{"id":"faq","icon":"❓","title":"Perguntas frequentes","html":"\n<details class=\"mm-faq\"><summary>Meus dados estão seguros? Onde ficam?</summary><div>Ficam no seu aparelho, com cópia interna de segurança e pontos de restauração automáticos. Nada é enviado para a internet. Por isso, faça backup externo regularmente e proteja o aparelho (PIN em Configurações → Segurança).</div></details>\n<details class=\"mm-faq\"><summary>Posso usar no celular e no computador ao mesmo tempo?</summary><div>Pode, mas cada aparelho tem os <b>seus próprios dados</b>, sem sincronização automática. Para levar dados de um para o outro, use Backup completo + Restaurar.</div></details>\n<details class=\"mm-faq\"><summary>Esqueci minha senha. E agora?</summary><div>Não há recuperação automática, porque os dados ficam só no aparelho. Se você tiver um backup, é possível restaurá-lo após reinstalar. Por isso anote login e senha em local seguro. Em caso de dificuldade, fale com o suporte do MEU TERREIRO pelo WhatsApp do plano.</div></details>\n<details class=\"mm-faq\"><summary>O app envia WhatsApp sozinho?</summary><div>Não. Ele abre o WhatsApp com a mensagem pronta e <b>você confirma</b> o envio. Também não é possível disparar para várias pessoas de uma vez: abra uma conversa por vez (o convite de gira organiza essa fila).</div></details>\n<details class=\"mm-faq\"><summary>Por que uma pessoa não aparece em Mensalidades?</summary><div>Aparecem pessoas com forma de contribuição <b>Mensalidade</b>, independentemente do tipo de pessoa. Confira o tipo e a forma de contribuição no cadastro. Consulentes, convidados e isentos não entram.</div></details>\n<details class=\"mm-faq\"><summary>Como registro uma contribuição avulsa (doação)?</summary><div>No cadastro, escolha <b>Pagamento avulso / outro motivo</b>, informe valor, motivo e vencimento. Salve e use <b>Lançar pagamento</b> na ficha; revise e salve no Financeiro.</div></details>\n<details class=\"mm-faq\"><summary>Por que a chamada não mostra ninguém?</summary><div>A chamada lista pessoas com <b>Controlar frequência</b> marcado (por padrão, Mensalistas ativos). Marque a opção no cadastro, ou use <b>＋ Incluir outra pessoa</b> na própria chamada.</div></details>\n<details class=\"mm-faq\"><summary>Meu compromisso não aparece para fazer chamada.</summary><div>A lista mostra compromissos dos últimos 60 dias cujo <b>tipo conta para a frequência</b>. Em Frequência → <b>Regras e meta</b>, marque os tipos que devem contar (por padrão, Gira e Reunião). Compromissos futuros só aparecem depois do dia.</div></details>\n<details class=\"mm-faq\"><summary>Atraso conta como falta? E a falta justificada?</summary><div>Atraso conta como <b>presença</b>. A falta justificada segue a regra que você escolher em Regras e meta: não entra no cálculo (padrão), conta como presença ou conta como falta.</div></details>\n<details class=\"mm-faq\"><summary>Por que o relatório de frequência está vazio?</summary><div>Ele só mostra chamadas já registradas e salvas. Faça a chamada das giras (ou ajuste o <b>Período</b> e o <b>Tipo</b> no topo do relatório).</div></details>\n<details class=\"mm-faq\"><summary>Como vejo exatamente quem está com 3 faltas seguidas?</summary><div>Em Pessoas → <b>Frequência</b>, essas pessoas ficam <b>fixadas no topo</b>, em destaque, com as datas das faltas. Você também pode tocar no filtro <b>⚠️ Faltas seguidas</b> ou no aviso da tela Inicial, que mostra os nomes.</div></details>\n<details class=\"mm-faq\"><summary>Como convido os consulentes sem esquecer de ninguém?</summary><div>Use <b>📣 Convidar consulentes para gira</b>. Marque, no cadastro de cada consulente, “Quer receber convite para as giras”. A fila mostra quem já foi convidado e quem falta.</div></details>\n<details class=\"mm-faq\"><summary>Como cadastro uma função que não está na lista?</summary><div>No cadastro da pessoa, em Função / vínculo escolha <b>＋ Outra função (digitar manualmente)</b>, escreva e salve. Ela fica disponível nos próximos cadastros.</div></details>\n<details class=\"mm-faq\"><summary>Como mudo o nome “Pessoas”?</summary><div>Configurações → <b>Terminologia</b> → Alterar. Você pode usar Filhos da Casa, Membros, Integrantes…</div></details>\n<details class=\"mm-faq\"><summary>O PDF não abre.</summary><div>O PDF abre em uma nova janela. Permita <b>pop-ups</b> para o app no navegador e tente de novo.</div></details>\n<details class=\"mm-faq\"><summary>O que é o Modo Restrito?</summary><div>Acontece quando o período gratuito termina e o PRO não está ativo. Os dados ficam preservados; só os módulos operacionais ficam bloqueados. Ative o PRO em Plano &amp; Assinatura.</div></details>\n<details class=\"mm-faq\"><summary>Como saio do Modo Demonstração?</summary><div>Use o botão de sair da demonstração (ou recarregue o app). As alterações feitas durante a demonstração são descartadas e seus dados reais voltam.</div></details>\n<details class=\"mm-faq\"><summary>Posso excluir uma pessoa?</summary><div>Pode: abra a ficha, toque em Editar e depois em Excluir. Para quem deixou a casa, prefira marcar como <b>Inativa</b> para manter o histórico.</div></details>\n<details class=\"mm-faq\"><summary>Como atualizo o app?</summary><div>Ao abrir com internet, o app se atualiza sozinho para a versão mais nova. A versão atual aparece no rodapé do menu lateral. Faça um backup antes de atualizações grandes.</div></details>\n"},{"id":"glossario","icon":"📖","title":"Glossário","html":"\n<table class=\"mm-table\"><thead><tr><th>Termo</th><th>Significado no app</th></tr></thead><tbody>\n<tr><td>Gira</td><td>Sessão ritual da casa; é um tipo de compromisso na Agenda.</td></tr>\n<tr><td>Mensalista</td><td>Pessoa da casa que contribui com mensalidade.</td></tr>\n<tr><td>Consulente</td><td>Pessoa que busca atendimento e frequenta a assistência.</td></tr>\n<tr><td>Convidado</td><td>Visita ou convidado, sem contribuição.</td></tr>\n<tr><td>Competência</td><td>Mês a que um valor se refere (pode ser diferente da data do pagamento).</td></tr>\n<tr><td>Centro de custo</td><td>Área da casa que gera gastos ou entradas (Cozinha, Festa, Manutenção…).</td></tr>\n<tr><td>Fundo</td><td>Dinheiro separado por finalidade, sem ser uma conta bancária.</td></tr>\n<tr><td>Conciliação</td><td>Conferência do saldo calculado pelo app com o saldo real da conta.</td></tr>\n<tr><td>Chamada</td><td>Registro de presença de cada pessoa em um compromisso.</td></tr>\n<tr><td>Frequência</td><td>Porcentagem de presenças em relação às chamadas consideradas.</td></tr>\n<tr><td>Meta</td><td>Frequência mínima esperada (padrão 75%).</td></tr>\n<tr><td>Faltas seguidas</td><td>Ausências consecutivas que disparam o alerta (padrão: 3).</td></tr>\n<tr><td>Estoque mínimo / ideal</td><td>Quantidade abaixo da qual o item é alertado / quantidade desejada para a reposição.</td></tr>\n<tr><td>Cotação</td><td>Comparação de preços e prazos entre fornecedores.</td></tr>\n<tr><td>Modo Restrito</td><td>Estado após o período gratuito sem PRO: dados preservados, módulos operacionais bloqueados.</td></tr>\n<tr><td>PWA</td><td>Aplicativo instalado a partir do navegador, com ícone próprio.</td></tr>\n<tr><td>Backup</td><td>Arquivo com todos os seus dados, para guardar fora do aparelho.</td></tr>\n<tr><td>Ponto de restauração</td><td>Cópia interna do app, a que você pode voltar.</td></tr>\n</tbody></table>\n"}];
const MT_MANUAL_CSS="\n.mm-root{--d:#13261d;--g:#c99a3b;--bg:#f6f2e8;--sf:#fffdf8;--ln:#e4decf;--mu:#6f756d;--ink:#222721;position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\n.mm-root.mm-page{position:static;min-height:100vh;height:100vh}\n.mm-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--d);color:#fff;flex:none}\n.mm-title{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:none}\n.mm-title b{font:600 17px Georgia,serif;white-space:nowrap}\n.mm-title small{color:#d9d2bd;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.mm-search{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:0 10px;min-width:0;max-width:560px;margin:0 auto}\n.mm-search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px;padding:9px 2px;color:var(--ink);min-width:0}\n.mm-search button{border:0;background:transparent;color:var(--mu);cursor:pointer;font-size:14px}\n.mm-btn2,.mm-ico{border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:10px;padding:8px 12px;font:600 13px/1 inherit;cursor:pointer;white-space:nowrap}\n.mm-btn2:hover,.mm-ico:hover{background:#ffffff2a}\n.mm-ico{display:none;font-size:18px;padding:7px 11px}\n.mm-body{flex:1;display:grid;grid-template-columns:270px 1fr;min-height:0}\n.mm-toc{overflow-y:auto;background:#fbf8f0;border-right:1px solid var(--ln);padding:14px 10px 30px}\n.mm-toc-h{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:0 10px 8px}\n.mm-toc a{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:10px;color:#34413a;text-decoration:none;font-size:13.5px;line-height:1.35;cursor:pointer}\n.mm-toc a span{flex:none;width:22px;text-align:center}\n.mm-toc a:hover{background:#efe9d8}\n.mm-toc a.on{background:var(--d);color:#fff}\n.mm-main{position:relative;overflow-y:auto;padding:22px clamp(14px,4vw,48px) 80px}\n.mm-wrap{max-width:900px;margin:0 auto}\n.mm-hero{background:linear-gradient(135deg,#13261d,#2a4a3a);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:22px}\n.mm-hero h1{font:600 28px/1.2 Georgia,serif;margin:0 0 8px}\n.mm-hero p{margin:0 0 12px;color:#e8e2cf;font-size:14.5px}\n.mm-chips{display:flex;flex-wrap:wrap;gap:8px}\n.mm-chips button{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:99px;padding:7px 13px;font:600 12.5px/1 inherit;cursor:pointer}\n.mm-chips button:hover{background:var(--g);border-color:var(--g);color:#13261d}\n.mm-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 24px}\n.mm-legend>div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px;color:#4a554e}\n.mm-ch{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px clamp(16px,3vw,30px) 18px;margin-bottom:22px;scroll-margin-top:8px}\n.mm-ch>h2{font:600 24px/1.25 Georgia,serif;margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid var(--g);color:var(--d)}\n.mm-ch h3{font:700 16.5px/1.3 inherit;color:var(--d);margin:22px 0 8px}\n.mm-ch p{margin:8px 0}\n.mm-ch ul,.mm-ch ol{margin:8px 0;padding-left:22px}\n.mm-ch li{margin:4px 0}\n.mm-where{background:#eef4ef;border-left:4px solid #2e7a55;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px}\n.mm-tip{background:#fff7e0;border-left:4px solid var(--g);border-radius:8px;padding:9px 12px;margin:12px 0;font-size:14px}\n.mm-warn{background:#fdecea;border-left:4px solid #b3423a;border-radius:8px;padding:9px 12px;margin:12px 0;font-size:14px}\n.mm-steps{counter-reset:s;list-style:none;padding:0!important}\n.mm-steps li{counter-increment:s;position:relative;padding:8px 10px 8px 42px;margin:6px 0;background:#faf7ef;border:1px solid var(--ln);border-radius:10px}\n.mm-steps li::before{content:counter(s);position:absolute;left:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--d);color:#fff;font:700 12px/24px Arial,sans-serif;text-align:center}\n.mm-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;display:block;overflow-x:auto}\n.mm-table th,.mm-table td{border:1px solid var(--ln);padding:7px 10px;text-align:left;vertical-align:top}\n.mm-table th{background:#f1ebdb;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#4a554e}\n.mm-table td:first-child{white-space:nowrap;font-weight:700;color:var(--d)}\n.mm-b{display:inline-block;background:#13261d;color:#fff;border-radius:7px;padding:1px 8px;font-size:12.5px;font-weight:600;white-space:nowrap}\n.mm-b.g{background:var(--g);color:#13261d}\n.mm-b.w{background:#fff;color:#13261d;border:1px solid #bdb59e}\n.mm-faq{border:1px solid var(--ln);border-radius:10px;margin:8px 0;background:#faf7ef}\n.mm-faq summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--d)}\n.mm-faq div{padding:0 14px 12px}\n.mm-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:12px;border-top:1px dashed var(--ln)}\n.mm-nav button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:8px 12px;font:600 13px/1 inherit;color:var(--d);cursor:pointer}\n.mm-nav button:hover{background:#f1ebdb}\n.mm-empty{text-align:center;padding:40px 10px;color:var(--mu)}\n.mm-ch mark{background:#ffe08a;border-radius:3px;padding:0 2px}\n.mm-foot{text-align:center;color:var(--mu);font-size:12px;margin:10px 0 0}\n@media(max-width:860px){\n .mm-body{grid-template-columns:1fr}\n .mm-ico{display:inline-block}\n .mm-toc{position:absolute;left:0;top:57px;bottom:0;width:min(86vw,320px);z-index:3;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 24px #0003}\n .mm-root.mm-open .mm-toc{transform:none}\n .mm-title small{display:none}\n .mm-lbl{display:none}\n .mm-btn2{padding:8px 12px;font-size:16px}\n .mm-title b{font-size:15px;overflow:hidden;text-overflow:ellipsis}\n .mm-top{flex-wrap:wrap}\n .mm-search{order:5;flex:1 1 100%;max-width:none;margin:0}\n .mm-top .mm-title{flex:1 1 auto}\n .mm-toc{top:105px}\n .mm-hero h1{font-size:23px}\n .mm-ch>h2{font-size:21px}\n}\n@media print{\n .mm-root{position:static!important;height:auto!important;display:block}\n .mm-top,.mm-toc,.mm-nav,.mm-chips,.mm-search{display:none!important}\n .mm-body{display:block}.mm-main{overflow:visible;padding:0}\n .mm-ch{break-inside:auto;border:0;padding:0;margin-bottom:18px}.mm-ch>h2{break-after:avoid}\n .mm-hero{color:#000;background:#fff;border:1px solid #999}.mm-hero p{color:#222}\n}";
function mmNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function mmPlain(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||''}
function mmMark(root,q){
 const w=document.createTreeWalker(root,4,null),nodes=[];
 while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{
  const raw=n.nodeValue,nn=mmNorm(raw);
  if(nn.length!==raw.length||!nn.includes(q))return;
  const frag=document.createDocumentFragment();let i=0,k;
  while((k=nn.indexOf(q,i))>-1){
   if(k>i)frag.appendChild(document.createTextNode(raw.slice(i,k)));
   const m=document.createElement('mark');m.textContent=raw.slice(k,k+q.length);frag.appendChild(m);i=k+q.length;
  }
  if(i<raw.length)frag.appendChild(document.createTextNode(raw.slice(i)));
  n.parentNode.replaceChild(frag,n);
 });
}
function mtManualPrintBody(){
 return `<style>.mmp h2{font:600 20px Georgia,serif;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid #c99a3b;color:#13261d;break-after:avoid}.mmp h3{font:700 14px Arial;margin:14px 0 4px;color:#13261d}.mmp p,.mmp li{font-size:12px;line-height:1.5}.mmp table{border-collapse:collapse;width:100%;margin:6px 0;font-size:11px}.mmp th,.mmp td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}.mmp th{background:#f1ebdb}.mmp .mm-where,.mmp .mm-tip,.mmp .mm-warn{border-left:4px solid #c99a3b;background:#faf6e8;padding:5px 9px;margin:6px 0;font-size:11.5px}.mmp .mm-warn{border-color:#b3423a;background:#fdf0ee}.mmp .mm-b{border:1px solid #13261d;border-radius:4px;padding:0 5px;font-size:11px;font-weight:700}.mmp details{margin:4px 0}.mmp summary{font-weight:700}.mmp ol.mm-steps{padding-left:20px}</style><div class="mmp">${MT_MANUAL.map((c,i)=>`<h2>${i+1}. ${c.title}</h2>${c.html}`).join('')}</div>`;
}
function mtManualRender(host,o){
 o=o||{};
 if(!document.getElementById('mm-style')){const st=document.createElement('style');st.id='mm-style';st.textContent=MT_MANUAL_CSS;document.head.appendChild(st)}
 host.classList.add('mm-root');if(o.page)host.classList.add('mm-page');
 const ch=MT_MANUAL,ver=o.version||'',orig={};ch.forEach(c=>orig[c.id]=c.html);
 const chip=(id,t)=>`<button data-mm="go" data-id="${id}">${t}</button>`;
 host.innerHTML=`<div class="mm-top">
  <button class="mm-ico" data-mm="toc" aria-label="Capítulos">☰</button>
  <div class="mm-title"><b>Manual do usuário</b><small>MEU TERREIRO${ver?' · V'+ver:''}${o.house?' · '+o.house:''}</small></div>
  <button class="mm-btn2" data-mm="print" aria-label="Imprimir ou salvar em PDF">🖨<span class="mm-lbl"> Imprimir / PDF</span></button>
  ${o.onClose?'<button class="mm-btn2" data-mm="close" aria-label="Fechar o manual">✕<span class="mm-lbl"> Fechar</span></button>':''}
  <div class="mm-search"><span>🔎</span><input id="mm_q" type="search" placeholder="Buscar no manual: chamada, WhatsApp, PDF, mensalidade…" autocomplete="off"><button data-mm="clear" aria-label="Limpar busca">✕</button></div>
 </div>
 <div class="mm-body">
  <nav class="mm-toc" id="mm_toc"><div class="mm-toc-h">Capítulos</div>${ch.map((c,i)=>`<a data-mm="go" data-id="${c.id}"><span>${c.icon}</span><i style="font-style:normal">${i+1}. ${c.title}</i></a>`).join('')}</nav>
  <main class="mm-main" id="mm_main"><div class="mm-wrap">
   <div class="mm-hero" id="mm_hero"><h1>Tudo sobre o MEU TERREIRO, passo a passo</h1><p>Este manual explica cada tela, botão e função do aplicativo, com dicas de uso e respostas às dúvidas mais comuns. Use o índice à esquerda (ou o botão ☰ no celular) e a busca no topo.</p><div class="mm-chips">${chip('inicio','🚀 Começar')}${chip('pessoas','👥 Pessoas')}${chip('frequencia','📋 Chamada e frequência')}${chip('consulentes','🕯️ Consulentes')}${chip('financeiro','💰 Financeiro')}${chip('backup','🛡️ Backup')}${chip('faq','❓ Dúvidas')}</div></div>
   <div class="mm-legend" id="mm_legend"><div>📍 <b>Onde fica</b>: o caminho até a tela.</div><div>💡 <b>Dica</b>: jeito mais rápido ou mais seguro de fazer.</div><div>⚠️ <b>Atenção</b>: algo que merece cuidado.</div><div><span class="mm-b">Botão</span> nomes de botões aparecem assim, como na tela.</div></div>
   <div class="mm-empty" id="mm_empty" hidden>Nenhum capítulo encontrado. Tente outra palavra.</div>
   ${ch.map((c,i)=>`<section class="mm-ch" id="mm-${c.id}" data-id="${c.id}"><h2>${c.icon} ${i+1}. ${c.title}</h2><div class="mm-content">${c.html}</div><div class="mm-nav">${i>0?`<button data-mm="go" data-id="${ch[i-1].id}">← ${ch[i-1].title}</button>`:'<span></span>'}${i<ch.length-1?`<button data-mm="go" data-id="${ch[i+1].id}">${ch[i+1].title} →</button>`:'<button data-mm="top">↑ Voltar ao início</button>'}</div></section>`).join('')}
   <p class="mm-foot">Manual do MEU TERREIRO${ver?' · versão '+ver:''} — as telas podem mudar conforme o app evolui.</p>
  </div></main></div>`;
 const main=host.querySelector('#mm_main'),toc=host.querySelector('#mm_toc'),q=host.querySelector('#mm_q');
 const secs=[...host.querySelectorAll('.mm-ch')];
 const go=id=>{const s=host.querySelector('#mm-'+id);if(!s)return;if(s.hidden){q.value='';search('')}host.classList.remove('mm-open');main.scrollTop=s.offsetTop-12};
 function search(v){
  const n=mmNorm(v.trim());let shown=0;
  secs.forEach((s,i)=>{
   const c=ch[i],box=s.querySelector('.mm-content');box.innerHTML=orig[c.id];
   const hit=!n||mmNorm(mmPlain(c.html)+' '+c.title).includes(n);
   s.hidden=!hit;if(hit){shown++;if(n)mmMark(box,n)}
  });
  host.querySelector('#mm_empty').hidden=shown>0;
  host.querySelector('#mm_hero').hidden=!!n;host.querySelector('#mm_legend').hidden=!!n;
  toc.querySelectorAll('a').forEach((a,i)=>{a.style.display=secs[i].hidden?'none':''});
  if(n)main.scrollTop=0;
 }
 host.addEventListener('click',e=>{
  const b=e.target.closest('[data-mm]');if(!b)return;
  const a=b.dataset.mm;
  if(a==='go')go(b.dataset.id);
  else if(a==='toc')host.classList.toggle('mm-open');
  else if(a==='top')main.scrollTop=0;
  else if(a==='clear'){q.value='';search('');q.focus()}
  else if(a==='close'&&o.onClose)o.onClose();
  else if(a==='print'){if(o.onPrint)o.onPrint(mtManualPrintBody());else window.print()}
 });
 let t=null;q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>search(q.value),160)});
 let tick=false;
 main.addEventListener('scroll',()=>{if(tick)return;tick=true;(window.requestAnimationFrame||setTimeout)(()=>{tick=false;const y=main.scrollTop+40;let cur=null;secs.forEach(s=>{if(!s.hidden&&s.offsetTop<=y)cur=s.dataset.id});toc.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===cur))})});
 if(o.start)setTimeout(()=>go(o.start),30);
 return {go,search};
}
mtManualRender(document.getElementById("app"),{version:"0.4.9.8",page:true});
</script></body></html>
